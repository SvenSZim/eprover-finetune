# Configuration for tools/port_upstream.py -- see tools/UPSTREAM_SYNC.md

upstream_ref = "upstream/master"   # pristine mirror of eprover/eprover
port_branch  = "upstream-port"     # upstream history translated to our layout

# Upstream commit the fork was based on. The port branch starts here, so the
# merge-base with our master is this commit.
base = "3b7afc70fe77d3118bb95144c4735ca45f5f31cf"

# Paths that are not carried over. A pattern ending in "/" is a directory
# prefix; anything else is an fnmatch glob over the whole path ("*" also
# matches "/"). These must mirror what we deleted from the fork (checked by
# `port_upstream.py check-base`).
drop = [
  "*.pyc",
  "*__pycache__/*",
  "etc/STAREXEC2.2/",
  "etc/STAREXEC3.0/",
  "etc/starexec_*",
  "PYTHON/EXAMPLE_CFG/",
  "PYTHON/e_ltb_runner.py",
  "PYTHON/e_ltb_runner22.py",
  "PYTHON/e_ltb_runnerj5.py",
  "PYTHON/emaster.py",
  "PYTHON/eserver.py",
  "PYTHON/enetcat.py",
  "PYTHON/prunner.py",
  "PYTHON/udp_dump.py",
  "PYTHON/bsub_eprover.py",
  "PYTHON/e_buffy.py",
  "PYTHON/fix_prot.py",
  "PYTHON/pylib_emaster.py",
  "PYTHON/pylib_emconf.py",
  "PYTHON/pylib_e_multi.py",
  "PYTHON/pylib_eserver.py",
  "PYTHON/pylib_tcp.py",
  "development_tools/*.awk",
  "development_tools/*.sh",
  # old build system, replaced by CMake (still reported through `watch`)
  "Makefile",
  "Makefile.vars",
  "Makefile.services",
  "configure",
  "BASICS/Makefile", "CLAUSES/Makefile", "CONTRIB/Makefile", "CONTROL/Makefile",
  "DOC/Makefile", "EXTERNAL/Makefile", "HEURISTICS/Makefile", "INOUT/Makefile",
  "LEARN/Makefile", "ORDERINGS/Makefile", "PCL2/Makefile", "PROPOSITIONAL/Makefile",
  "PROVER/Makefile", "PYTHON/Makefile", "SIMPLE_APPS/Makefile", "TERMS/Makefile",
  "development_tools/Makefile", "development_tools/configure_tools",
  "development_tools/e_install",
  "etc/Makefile.flat.template*",
]

# Prefix renames applied after `drop`, as [old, new] pairs (longest prefix
# wins). This is the directory restructure (see tools/UPSTREAM_SYNC.md).
rename = [
  # libraries
  ["BASICS/", "src/basics/"],
  ["INOUT/", "src/inout/"],
  ["TERMS/", "src/terms/"],
  ["ORDERINGS/", "src/orderings/"],
  ["CLAUSES/", "src/clauses/"],
  ["PROPOSITIONAL/", "src/propositional/"],
  ["LEARN/", "src/learn/"],
  ["PCL2/", "src/pcl2/"],
  ["HEURISTICS/", "src/heuristics/"],
  ["CONTROL/", "src/control/"],
  ["CONTRIB/", "third_party/"],
  ["PROVER/", "apps/"],
  ["SIMPLE_APPS/", "apps/simple/"],
  ["EXTERNAL/", "apps/external/"],
  ["EXAMPLE_PROBLEMS/", "tests/problems/"],
  ["DOC/", "docs/"],
  ["development_tools/", "tools/development/"],
  ["PYTHON/", "tools/python/"],
  ["SKELETONS/", "tools/skeletons/"],
  # sample problems that lived next to the programs (longest prefix wins)
  ["PROVER/ALL_RULES.lop", "tests/problems/prover/ALL_RULES.lop"],
  ["PROVER/BOO001-1+rm_eq_rstfp.lop", "tests/problems/prover/BOO001-1+rm_eq_rstfp.lop"],
  ["PROVER/BatchSampleLTBHOL.txt", "tests/problems/prover/BatchSampleLTBHOL.txt"],
  ["PROVER/COL003-1+rm_eq_rstfp.lop", "tests/problems/prover/COL003-1+rm_eq_rstfp.lop"],
  ["PROVER/GROUP.lop", "tests/problems/prover/GROUP.lop"],
  ["PROVER/GRP001-1_natural.lop", "tests/problems/prover/GRP001-1_natural.lop"],
  ["PROVER/HUMBLE.lop", "tests/problems/prover/HUMBLE.lop"],
  ["PROVER/INVCOM.lop", "tests/problems/prover/INVCOM.lop"],
  ["PROVER/LAT3a.lop", "tests/problems/prover/LAT3a.lop"],
  ["PROVER/LAT4.lop", "tests/problems/prover/LAT4.lop"],
  ["PROVER/LUSK3.lop", "tests/problems/prover/LUSK3.lop"],
  ["PROVER/LUSK6.lop", "tests/problems/prover/LUSK6.lop"],
  ["PROVER/LUSK6ext.lop", "tests/problems/prover/LUSK6ext.lop"],
  ["PROVER/MSC006-1.lop", "tests/problems/prover/MSC006-1.lop"],
  ["PROVER/NUM030-1+rm_eq_rstfp.lop", "tests/problems/prover/NUM030-1+rm_eq_rstfp.lop"],
  ["PROVER/PLA002-2+rm_eq_rstfp.lop", "tests/problems/prover/PLA002-2+rm_eq_rstfp.lop"],
  ["PROVER/PUZ031-1+rm_eq_rstfp.lop", "tests/problems/prover/PUZ031-1+rm_eq_rstfp.lop"],
  ["PROVER/RNG019-6+rm_eq_rstfp.tptp", "tests/problems/prover/RNG019-6+rm_eq_rstfp.tptp"],
  ["PROVER/SET103-6+rm_eq_rstfp.lop", "tests/problems/prover/SET103-6+rm_eq_rstfp.lop"],
  ["PROVER/SET366+4+rm_eq_rstfp.tptp", "tests/problems/prover/SET366+4+rm_eq_rstfp.tptp"],
]

# Upstream commits touching these paths (even dropped ones, such as the old
# Makefiles) get a `Port-Watch:` trailer and are listed in the sync report,
# because the change needs a human to mirror it in CMakeLists.txt.
watch = [
  "Makefile*",
  "*/Makefile*",
  "configure",
  "*/makefile.in",
]
# ... except these (Makefile.vars is toggled for experiments in many commits).
watch_ignore = [
  "Makefile.vars",
]

# Paths that cannot be translated mechanically (files we split up). The tool
# stops before a commit touching one of these; see UPSTREAM_SYNC.md.
halt_on = [
]

# Formatter applied to every carried-over blob whose *new* path matches `globs`
# (so vendored code in third_party/ is untouched). `command` reads the file on
# stdin and writes it to stdout; "{path}" is the new path and "{root}" the
# repository root. Keep in sync with tools/format.sh, and use `migrate` after
# changing anything here or in .clang-format: the output must be byte-identical
# to what tools/format.sh produces, otherwise merges conflict.
[format]
globs   = ["src/*.c", "src/*.h", "apps/*.c", "apps/*.h"]
command = ["clang-format", "--style=file:{root}/.clang-format", "--assume-filename={path}"]
version = "23.1.1"
passes  = 2
