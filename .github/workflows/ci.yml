name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned clang-format
        run: pip install clang-format==23.1.1
      - name: Check formatting
        run: tools/format.sh --check

  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build (first-order)
        run: |
          cmake --preset dev
          cmake --build --preset dev -j"$(nproc)"
      # Clause counts depend on the toolchain (see tests/regression/README.md),
      # so CI compares statuses only. Exact counts are for local refactoring.
      - name: Regression suite
        run: tests/regression/run.py -j"$(nproc)" --status-only

  build-ho:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build (higher-order)
        run: |
          cmake --preset ho
          cmake --build --preset ho -j"$(nproc)"
      # TODO: add the tests/problems/LFHOL problems to the regression suite

  sanitizers:
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Build with ASan + UBSan
        run: |
          cmake --preset asan
          cmake --build --preset asan -j"$(nproc)"
      - name: Regression suite
        run: tests/regression/run.py -j"$(nproc)" --status-only --binary build/asan/bin/eprover --cpu-limit 180
