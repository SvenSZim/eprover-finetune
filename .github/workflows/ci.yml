name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned clang-format
        run: pip install clang-format==23.1.1
      - name: Check formatting
        run: tools/format.sh --check

  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build (first-order)
        run: |
          cmake --preset dev
          cmake --build --preset dev -j"$(nproc)"
      # Exact clause counts: the search does not depend on the memory layout
      # (see tests/regression/README.md). If a new compiler ever disagrees
      # because of floating point, fall back to --status-only.
      - name: Regression suite
        run: tests/regression/run.py -j"$(nproc)" --cpu-limit 240
      - name: Determinism (ASLR, file names, uninitialised memory)
        run: tests/regression/determinism.py

  build-ho:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build (higher-order)
        run: |
          cmake --preset ho
          cmake --build --preset ho -j"$(nproc)"
      # TODO: add the tests/problems/LFHOL problems to the regression suite

  sanitizers:
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v5
      - name: Build with ASan + UBSan
        run: |
          cmake --preset asan
          cmake --build --preset asan -j"$(nproc)"
      # The asan preset uses the system malloc (no arena) so that ASan sees every
      # allocation; its search order can therefore differ: statuses only.
      - name: Regression suite
        run: tests/regression/run.py -j"$(nproc)" --status-only --binary build/asan/bin/eprover --cpu-limit 600
